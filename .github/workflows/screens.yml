name: Screenshots of all screens

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant ru.sansara.app android.permission.POST_NOTIFICATIONS || true
            bash tools/shoot_screens.sh screens
      - uses: actions/upload-artifact@v4
        with:
          name: SANSARA-screens
          path: screens
      - name: Publish screenshots to branch ci-screens
        run: |
          git config user.name "ci"; git config user.email "ci@example.com"
          git checkout --orphan ci-screens
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p shots && cp screens/*.png shots/
          git add shots
          git commit -m "screenshots ${GITHUB_SHA}"
          git push -f origin ci-screens
