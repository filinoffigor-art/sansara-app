name: Devices

# Все экраны на разных телефонах: маленький экран, крупный шрифт, старый Android, планшет.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Список экранов через пробел (пусто = все)'
        required: false
        default: ''
  push:
    branches: [ claude/quick-fixes-0.23.1 ]
    paths: [ ".github/workflows/devices.yml" ]

permissions:
  contents: write

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: small        # бюджетный телефон 360×640 dp
            api: 34
            size: 720x1280
            density: 320
            font: '1.0'
          - name: bigfont      # обычный телефон, крупный шрифт 130 %
            api: 34
            size: 1080x2400
            density: 420
            font: '1.3'
          - name: android8     # самая старая поддерживаемая версия Android
            api: 26
            size: 1080x1920
            density: 420
            font: '1.0'
          - name: tablet       # планшет 10 дюймов
            api: 34
            size: 1600x2560
            density: 320
            font: '1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screens and stress test
        timeout-minutes: 55
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          WM_SIZE: ${{ matrix.size }}
          WM_DENSITY: ${{ matrix.density }}
          FONT_SCALE: ${{ matrix.font }}
          MONKEY_EVENTS: '1500'
          ONLY: ${{ inputs.only || '' }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/shots.sh && bash .github/scripts/monkey.sh
      - name: Publish to branch ci-dev-${{ matrix.name }}
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/s" && cp shots/* "$RUNNER_TEMP/s/" 2>/dev/null || true
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan ci-dev-${{ matrix.name }}
          git rm -rf . >/dev/null 2>&1 || true
          mkdir shots && cp "$RUNNER_TEMP"/s/* shots/ 2>/dev/null || true
          echo "${{ matrix.name }} api=${{ matrix.api }} size=${{ matrix.size }} density=${{ matrix.density }} font=${{ matrix.font }} $GITHUB_SHA" > shots/DEVICE.txt
          git add shots && git commit -qm "device ${{ matrix.name }} $GITHUB_SHA"
          git push -f origin ci-dev-${{ matrix.name }}
