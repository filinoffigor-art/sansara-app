name: Build SANSARA APK

on:
  push:
    branches: [ main, stage-1-compose-visual-lock, stage-2-data-auth-presence, stage-3-client-mvp, stage-4-production-stock, stage-5-admin, stage-5-admin-workflows, stage-6-full-workflows, claude/stage-a-backend, claude/quick-fixes-0.23.1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent debug keystore cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sansara-debug-keystore-v1

      - name: Configure persistent signing keystore
        env:
          SANSARA_KEYSTORE_BASE64: ${{ secrets.SANSARA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SANSARA_KEYSTORE_BASE64" ]; then
            echo "$SANSARA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sansara-upload.jks"
            echo "SANSARA_KEYSTORE_PATH=$RUNNER_TEMP/sansara-upload.jks" >> "$GITHUB_ENV"
            echo "Using persistent keystore from GitHub Secrets"
          else
            mkdir -p "$HOME/.android"
            echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              echo "::warning::Создан новый ключ подписи (кэш ключа пуст) — эта сборка не встанет поверх прежних"
            else
              echo "::notice::Ключ подписи восстановлен из кэша"
            fi
            echo "Persistent signing secret not configured; using cached debug keystore"
          fi

      - name: Build debug APK
        env:
          SANSARA_KEYSTORE_PASSWORD: ${{ secrets.SANSARA_KEYSTORE_PASSWORD }}
          SANSARA_KEY_ALIAS: ${{ secrets.SANSARA_KEY_ALIAS }}
          SANSARA_KEY_PASSWORD: ${{ secrets.SANSARA_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_SANSARA_BACKEND_API_URL: ${{ vars.SANSARA_BACKEND_API_URL || 'https://script.google.com/macros/s/AKfycbzzF4w-UsisqCPBFIBOEhzGBWcH_etG_JCJHzzARYaNQiA8mUe4T0Mm5RWlRBYLk7Empg/exec' }}
          ORG_GRADLE_PROJECT_SANSARA_BACKEND_API_KEY: ${{ secrets.SANSARA_BACKEND_API_KEY }}
          ORG_GRADLE_PROJECT_SANSARA_ADMIN_CODE: ${{ secrets.SANSARA_ADMIN_CODE }}
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E "^e: |error: |OutOfMemory|Caused by|What went wrong|Metaspace|GC overhead|FAILED|AssertionError" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && echo "::notice::$(grep -o '<testsuite [^>]*' "$f" | grep -o 'name="[^"]*"\|tests="[0-9]*"\|failures="[0-9]*"\|errors="[0-9]*"' | tr '\n' ' ')"; done
          exit $code

      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SANSARA-alpha-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish installable APK to branch ci-apk
        run: |
          set -e
          VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/SANSARA-$VER.apk"
          D=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256' | awk '{print $NF}')
          R=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/apk/SANSARA-$VER.apk" | grep -m1 'SHA-256' | awk '{print $NF}')
          echo "::notice::signer debug=$D release=$R same=$([ "$D" = "$R" ] && echo yes || echo NO)"
          # Ключ подписи закреплён: сборка с другим ключом не встанет поверх установленной версии — такую не выпускаем.
          EXPECTED=3595d3c6ca738f8bb722bbc73cc0ac6baa988a152c9b4bb865fce75ac1eb3e85
          R_NORM=$(echo "$R" | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$R_NORM" != "$EXPECTED" ]; then
            echo "::error::Ключ подписи изменился ($R_NORM вместо $EXPECTED). APK не встанет поверх — публикация остановлена."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/apk/SANSARA-$VER.apk" | head -n 2 | while IFS= read -r l; do echo "::notice::$l"; done
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan ci-apk
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP"/apk/*.apk .
          echo "$GITHUB_SHA $VER" > BUILD.txt
          git add *.apk BUILD.txt && git commit -qm "apk $VER $GITHUB_SHA"
          git push -f origin ci-apk
