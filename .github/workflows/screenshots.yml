name: Screens

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Список экранов через пробел (пусто = все)'
        required: false
        default: ''
      skip_tests:
        description: '1 = без UI-тестов'
        required: false
        default: ''
  push:
    branches: [ claude/stage-b-ui-fixes ]
    paths: [ ".github/workflows/screenshots.yml", ".github/scripts/**" ]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI tests on emulator (S24 Ultra screen)
        if: ${{ inputs.skip_tests != '1' }}
        timeout-minutes: 35
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/uitests.sh
      - name: Collect UI test report
        if: always()
        run: |
          mkdir -p shots
          {
            echo "UI-тесты (экран 1080x2340, 450 dpi):"
            for f in $(find app/build/outputs/androidTest-results -name '*.xml' 2>/dev/null); do
              grep -o '<testcase [^>]*' "$f" | sed -n 's/.*name="\([^"]*\)".*time="\([^"]*\)".*/\1 \2s/p'
              grep -c '<failure' "$f" | sed 's/^/провалов: /'
              grep -o '<failure[^>]*message="[^"]*' "$f" | sed 's/<failure[^>]*message="/  причина: /' | cut -c1-500
            done
            echo "---- XML ----"; for f in $(find app/build/outputs/androidTest-results app/build/outputs/connected_android_test_additional_output -name '*.xml' 2>/dev/null); do echo "== $f"; head -c 6000 "$f"; echo; done
            echo "---- строки о тестах ----"; grep -iE "test(s)? |failed|exception|crash|instrumentation|Starting|finished" uitests.log 2>/dev/null | grep -v Transforming | tail -60
            echo "---- хвост журнала ----"; tail -25 uitests.log 2>/dev/null || echo "журнала нет"
          } > shots/00_tests.txt
          cat shots/00_tests.txt | head -120
      - name: Screenshots on emulator
        if: always()
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ONLY="${{ inputs.only }}" bash .github/scripts/shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SANSARA-screens
          path: shots/
      - name: Publish shots to branch ci-screens
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/s" && cp shots/* "$RUNNER_TEMP/s/"
          rm -f shots_old_tests 2>/dev/null || true
          git fetch origin ci-screens:oldshots 2>/dev/null || true
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan ci-screens
          git rm -rf . >/dev/null 2>&1 || true
          mkdir shots && (git checkout oldshots -- shots 2>/dev/null || true)
          cp "$RUNNER_TEMP"/s/* shots/
          git add shots && git commit -qm "screens $GITHUB_SHA"
          git push -f origin ci-screens
