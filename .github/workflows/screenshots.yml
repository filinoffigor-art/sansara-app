name: Screens

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Список экранов через пробел (пусто = все)'
        required: false
        default: ''
  push:
    branches: [ claude/stage-b-ui-fixes ]
    paths: [ ".github/workflows/screenshots.yml", ".github/scripts/**" ]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ONLY="${{ inputs.only }}" bash .github/scripts/shots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SANSARA-screens
          path: shots/
      - name: Publish shots to branch ci-screens
        run: |
          mkdir -p "$RUNNER_TEMP/s" && cp shots/* "$RUNNER_TEMP/s/"
          git fetch origin ci-screens:oldshots 2>/dev/null || true
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan ci-screens
          git rm -rf . >/dev/null 2>&1 || true
          mkdir shots && (git checkout oldshots -- shots 2>/dev/null || true)
          cp "$RUNNER_TEMP"/s/* shots/
          git add shots && git commit -qm "screens $GITHUB_SHA"
          git push -f origin ci-screens
