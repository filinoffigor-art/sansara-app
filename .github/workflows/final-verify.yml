name: Final SANSARA Verification

on:
  push:
    branches: [ stage-6-full-workflows ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current final candidate
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent debug keystore cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sansara-debug-keystore-v1

      - name: Configure persistent signing keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.SANSARA_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.SANSARA_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.SANSARA_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.SANSARA_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"

          if [ -n "$SECRET_KEYSTORE_BASE64" ] &&
             [ -n "$SECRET_KEYSTORE_PASSWORD" ] &&
             [ -n "$SECRET_KEY_ALIAS" ] &&
             [ -n "$SECRET_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/sansara-upload.jks"
            KEYSTORE_PASSWORD="$SECRET_KEYSTORE_PASSWORD"
            KEY_ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASSWORD="$SECRET_KEY_PASSWORD"
            echo "$SECRET_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          else
            KEYSTORE_PATH="$HOME/.android/debug.keystore"
            KEYSTORE_PASSWORD="android"
            KEY_ALIAS="androiddebugkey"
            KEY_PASSWORD="android"

            if [ ! -f "$KEYSTORE_PATH" ]; then
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_PATH" \
                -storepass "$KEYSTORE_PASSWORD" \
                -alias "$KEY_ALIAS" \
                -keypass "$KEY_PASSWORD" \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000
            fi
          fi

          test -f "$KEYSTORE_PATH"
          echo "SANSARA_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SANSARA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SANSARA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SANSARA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build final APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify final package, version and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5)
          echo "$BADGING"
          echo "$BADGING" | grep "name='ru.sansara.app'"
          echo "$BADGING" | grep "versionCode='25'"
          echo "$BADGING" | grep "versionName='0.20.0-final'"

      - name: Download previous stable APK from run 81
        uses: actions/download-artifact@v4
        with:
          name: SANSARA-alpha-apk
          path: previous-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36856408455

      - name: Prepare previous APK for migration verification
        run: |
          PREV_APK=$(find previous-apk -type f -name '*.apk' | head -n 1)
          test -n "$PREV_APK"
          test -f "$SANSARA_KEYSTORE_PATH"
          echo "::warning::Run #81 used an ephemeral signing key. Re-signing that APK with the exact key used for the current candidate validates install-over migration and data preservation."
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$SANSARA_KEYSTORE_PATH" \
            --ks-key-alias "$SANSARA_KEY_ALIAS" \
            --ks-pass "pass:$SANSARA_KEYSTORE_PASSWORD" \
            --key-pass "pass:$SANSARA_KEY_PASSWORD" \
            --out previous-apk/previous-migration.apk \
            "$PREV_APK"

          PREV_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs previous-apk/previous-migration.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          CURRENT_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          test -n "$PREV_CERT"
          test -n "$CURRENT_CERT"
          test "$PREV_CERT" = "$CURRENT_CERT"
          echo "Migration signature match: $CURRENT_CERT"

      - name: Enable KVM acceleration when available
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device is not available; emulator will use software acceleration"
          fi

      - name: Verify install-over upgrade and data preservation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            test -f previous-apk/previous-migration.apk
            adb install previous-apk/previous-migration.apk
            adb shell pm grant ru.sansara.app android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n ru.sansara.app/.MainActivity
            sleep 4

            adb shell run-as ru.sansara.app mkdir -p /data/user/0/ru.sansara.app/files
            adb shell run-as ru.sansara.app touch /data/user/0/ru.sansara.app/files/upgrade-sentinel.txt
            adb shell run-as ru.sansara.app test -s /data/user/0/ru.sansara.app/databases/sansara.db

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell dumpsys package ru.sansara.app | grep versionCode | head -n 1
            adb shell dumpsys package ru.sansara.app | grep versionCode | head -n 1 | grep "versionCode=25"

            adb shell run-as ru.sansara.app test -f /data/user/0/ru.sansara.app/files/upgrade-sentinel.txt
            adb shell run-as ru.sansara.app test -s /data/user/0/ru.sansara.app/databases/sansara.db

            adb shell am force-stop ru.sansara.app
            adb shell am start -W -n ru.sansara.app/.MainActivity
            sleep 4
            test -n "$(adb shell pidof ru.sansara.app)"
            ! adb logcat -d -t 300 | grep -E "FATAL EXCEPTION.*ru\.sansara\.app|Process: ru\.sansara\.app.*FATAL"

            # Black-box Compose smoke tests: real access-code login for client/admin/production
            # and verification of key routes for each role. AndroidX Test Orchestrator
            # clears app data between tests so sessions cannot leak across roles.
            gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload fully verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SANSARA-0.20.0-final-verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
